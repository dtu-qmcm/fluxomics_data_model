[project]
name = "mfa-benchmarking"
version = "0.1.0"
description = "13C MFA benchmarking environment: freeflux, influx_si, x3cflux"
requires-python = "==3.10.*"

# freeflux 0.3.7 requires numpy<1.23, pandas~=1.0, scipy<1.9, matplotlib<=3.7
# x3cflux 3.0.1 is Linux x86_64 only (manylinux_2_27+)
dependencies = [
    "freeflux==0.3.7",
    "influx-si==7.4.3",
    "x3cflux==3.0.1",
    "isocor==2.2.3",
    "ipykernel",
    "jupyterlab",
]

[tool.uv]
package = false  # no Python package to build, just a dependency environment
# Pin the numpy/scipy/pandas versions that satisfy freeflux's strict constraints
# AND are compatible with influx_si and x3cflux
constraint-dependencies = [
    "numpy>=1.20,<1.23",
    "scipy>=1.5,<1.9",
    "pandas>=1.0,<2.0",
    "matplotlib>=3.2,<=3.7",
    "pyomo>=6.2,<=6.5",
]
